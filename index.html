<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐！廖姐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        
        h1 {
            color: #fff;
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }
        
        .subtitle {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .card-container {
            perspective: 1000px;
            margin: 40px auto;
            width: 300px;
            height: 400px;
            cursor: pointer;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border-radius: 15px;
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card-front {
            background: linear-gradient(45deg, #ff6b6b, #ffa8a8);
            color: white;
        }
        
        .card-front h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        
        .card-front p {
            font-size: 1.2rem;
            margin-top: 10px;
        }
        
        .card-back {
            background: linear-gradient(45deg, #ffd3b6, #ffaaa5);
            transform: rotateY(180deg);
            color: #333;
            text-align: center;
        }
        
        .card-back h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .card-back p {
            font-size: 1.1rem;
            margin: 8px 0;
        }
        
        .card.open {
            transform: rotateY(180deg);
        }
        
        .click-hint {
            color: white;
            margin-top: 15px;
            font-size: 1rem;
            opacity: 0.7;
            animation: bounce 2s infinite;
        }
        
        .additional-message {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-top: 40px;
            max-width: 600px;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .additional-message h3 {
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .additional-message p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .floating {
            animation: floating 6s ease-in-out infinite;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            border-radius: 50%;
            animation: confetti-fall 5s linear infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes confetti-fall {
            0% { 
                transform: translateY(-100px) rotate(0deg); 
                opacity: 1;
            }
            100% { 
                transform: translateY(100vh) rotate(360deg); 
                opacity: 0;
            }
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .card-container {
                width: 250px;
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="floating">生日快乐！</h1>
        <p class="subtitle">祝廖姐生日快乐，永远年轻美丽！</p>
        
        <div class="card-container">
            <div class="card">
                <div class="card-front">
                    <h2>给廖姐的贺卡</h2>
                    <p>点击打开惊喜</p>
                </div>
                <div class="card-back">
                    <h2>生日快乐</h2>
                    <p>Happy birthday</p>
                    <p>To 廖姐</p>
                    <p>一岁一礼，时刻欢喜</p>
                    <p>愿你往后余生尽是坦途</p>
                    <p>From 小张峰</p>
                </div>
            </div>
        </div>
        
        <p class="click-hint">点击贺卡打开惊喜</p>
        
        <div class="additional-message">
            <h3>更多祝福</h3>
            <p>在这个特别的日子里，愿所有的快乐、所有的幸福、所有的温馨、所有的好运都围绕在您身边！</p>
            <p>愿您的生活像这蛋糕一样甜蜜，愿您的未来像这烛光一样明亮！</p>
            <p>祝您生日快乐，万事如意，心想事成！</p>
        </div>
    </div>

    <script>
        // 贺卡交互
        const card = document.querySelector('.card');
        const cardContainer = document.querySelector('.card-container');
        
        cardContainer.addEventListener('click', function() {
            card.classList.toggle('open');
            
            // 播放音效（如果有的话）
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-happy-birthday-horn-576.mp3');
            audio.play().catch(e => console.log("音频自动播放被阻止，请手动交互"));
            
            // 创建五彩纸屑效果
            createConfetti();
        });
        
        // 创建五彩纸屑效果
        function createConfetti() {
            const colors = ['#ff6b6b', '#ffa8a8', '#ffd3b6', '#a8e6cf', '#74b9ff', '#a29bfe'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
                
                // 移除元素以保持性能
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        // 自动创建一些飘落的装饰
        function createFloatingDecorations() {
            const emojis = ['🎂', '🎁', '🎈', '⭐', '❤️', '✨'];
            
            for (let i = 0; i < 20; i++) {
                const decoration = document.createElement('div');
                decoration.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                decoration.style.position = 'absolute';
                decoration.style.left = Math.random() * 100 + 'vw';
                decoration.style.top = Math.random() * 100 + 'vh';
                decoration.style.fontSize = (Math.random() * 20 + 20) + 'px';
                decoration.style.opacity = Math.random() * 0.5 + 0.3;
                decoration.style.animation = `floating ${Math.random() * 6 + 4}s ease-in-out infinite`;
                decoration.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(decoration);
            }
        }
        
        // 页面加载完成后执行
        window.addEventListener('load', function() {
            createFloatingDecorations();
        });
    </script>
</body>
</html>
